<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="随手记">
<title>随手记</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:#f8fafc;position:relative;padding-bottom:70px}

/* 顶部 */
.header{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;padding:20px 16px 24px;border-radius:0 0 24px 24px}
.header h1{font-size:22px;font-weight:700;margin-bottom:4px}
.header p{font-size:13px;opacity:.85}

/* 统计卡片 */
.stats{display:flex;gap:12px;margin:-16px 16px 16px;position:relative;z-index:1}
.stat-card{flex:1;background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.stat-card .label{font-size:12px;color:#64748b;margin-bottom:6px}
.stat-card .value{font-size:20px;font-weight:700}
.stat-card.expense .value{color:#ef4444}
.stat-card.income .value{color:#22c55e}

/* 页面容器 */
.page{display:none;padding:0 16px}
.page.active{display:block}

/* 页面标题 */
.page-title{font-size:18px;font-weight:700;margin:16px 0 12px;color:#334155;display:flex;justify-content:space-between;align-items:center}
.page-title .count{font-size:13px;color:#94a3b8;font-weight:400}

/* 总览 - 最近记录 */
.recent-section{margin-top:8px}
.recent-item{background:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:8px;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.recent-item .ri-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.recent-item .ri-icon.expense{background:#fef2f2;color:#ef4444}
.recent-item .ri-icon.income{background:#f0fdf4;color:#22c55e}
.recent-item .ri-info{flex:1;min-width:0}
.recent-item .ri-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-item .ri-meta{font-size:11px;color:#94a3b8;margin-top:1px}
.recent-item .ri-amount{font-size:15px;font-weight:700;flex-shrink:0}
.recent-item .ri-amount.expense{color:#ef4444}
.recent-item .ri-amount.income{color:#22c55e}

/* 总览 - 奶茶预览 */
.milktea-preview{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.milktea-preview::-webkit-scrollbar{display:none}
.mp-card{flex-shrink:0;width:140px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.mp-card .mp-img{width:100%;height:100px;object-fit:cover;background:#f1f5f9}
.mp-card .mp-info{padding:10px 12px}
.mp-card .mp-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-card .mp-meta{font-size:11px;color:#94a3b8;margin-top:2px}

/* 记录列表 */
.record-list{display:flex;flex-direction:column;gap:10px}
.record-item{background:#fff;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer;transition:transform .15s}
.record-item:active{transform:scale(.98)}
.record-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.record-icon.expense{background:#fef2f2;color:#ef4444}
.record-icon.income{background:#f0fdf4;color:#22c55e}
.record-info{flex:1;min-width:0}
.record-info .name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.record-info .meta{font-size:12px;color:#94a3b8;margin-top:2px}
.record-amount{font-size:17px;font-weight:700;flex-shrink:0}
.record-amount.expense{color:#ef4444}
.record-amount.income{color:#22c55e}
.record-edit{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#94a3b8;flex-shrink:0;font-size:16px}

/* 奶茶列表 */
.milktea-item{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06);cursor:pointer;margin-bottom:12px}
.milktea-img{width:100%;height:160px;object-fit:cover;background:#f1f5f9}
.milktea-info{padding:14px 16px}
.milktea-info .name{font-size:16px;font-weight:700;color:#1e293b;margin-bottom:4px}
.milktea-info .meta{font-size:12px;color:#94a3b8;display:flex;justify-content:space-between}
.milktea-info .price{color:#f59e0b;font-weight:700}
.rating{color:#fbbf24;font-size:14px}

/* 空状态 */
.empty{text-align:center;padding:48px 20px;color:#94a3b8}
.empty .icon{font-size:48px;margin-bottom:12px}
.empty p{font-size:14px}

/* 底部导航栏 */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #e2e8f0;display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0 8px;cursor:pointer;transition:all .2s;color:#94a3b8}
.nav-item.active{color:#6366f1}
.nav-item .nav-icon{font-size:22px;margin-bottom:2px}
.nav-item .nav-label{font-size:11px;font-weight:600}
.nav-item.active .nav-label{font-weight:700}

/* 添加按钮（在导航栏中间） */
.nav-add{position:relative}
.nav-add .add-circle{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;margin-top:-20px;box-shadow:0 4px 12px rgba(99,102,241,.4);margin-bottom:2px}

/* 弹窗 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:24px 20px 32px;transform:translateY(100%);transition:transform .3s;max-height:90vh;overflow-y:auto}
.modal-overlay.show .modal{transform:translateY(0)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-header h2{font-size:19px;font-weight:700}
.modal-close{width:36px;height:36px;border-radius:50%;background:#f1f5f9;border:none;font-size:18px;color:#64748b;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-delete{width:36px;height:36px;border-radius:50%;background:#fef2f2;border:none;font-size:16px;color:#ef4444;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-right:8px}
.modal-header-actions{display:flex;align-items:center}

/* 收支选择 */
.type-selector{display:flex;gap:12px;margin-bottom:20px}
.type-btn{flex:1;padding:16px;border-radius:16px;border:3px solid;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:6px}
.type-btn.expense{border-color:#fecaca;background:#fef2f2;color:#ef4444}
.type-btn.income{border-color:#bbf7d0;background:#f0fdf4;color:#22c55e}
.type-btn.expense.active{background:#ef4444;border-color:#ef4444;color:#fff;box-shadow:0 4px 16px rgba(239,68,68,.35);transform:scale(1.02)}
.type-btn.income.active{background:#22c55e;border-color:#22c55e;color:#fff;box-shadow:0 4px 16px rgba(34,197,94,.35);transform:scale(1.02)}
.type-btn .type-icon{font-size:24px}
.type-btn .type-label{font-size:15px;font-weight:700}
.type-btn .type-check{font-size:14px;opacity:0;transition:opacity .2s}
.type-btn.active .type-check{opacity:1}

/* 表单 */
.form-group{margin-bottom:16px}
.form-label{font-size:13px;font-weight:600;color:#64748b;margin-bottom:8px;display:block}
.amount-input{width:100%;padding:16px;font-size:36px;font-weight:800;border:3px solid #e2e8f0;border-radius:16px;text-align:center;outline:none;transition:all .2s;background:#fff}
.amount-input.expense{border-color:#fecaca;color:#ef4444;caret-color:#ef4444}
.amount-input.income{border-color:#bbf7d0;color:#22c55e;caret-color:#22c55e}
.amount-input.expense:focus{border-color:#ef4444}
.amount-input.income:focus{border-color:#22c55e}
.form-input{width:100%;padding:14px 16px;font-size:15px;border:2px solid #e2e8f0;border-radius:12px;outline:none;transition:border-color .2s;background:#fff;color:#1e293b}
.form-input:focus{border-color:#6366f1}
.category-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.category-item{padding:12px 8px;border-radius:12px;background:#f8fafc;border:2px solid transparent;text-align:center;cursor:pointer;transition:all .15s}
.category-item:active{transform:scale(.95)}
.category-item.active{border-color:#6366f1;background:#eef2ff}
.category-item .cat-icon{font-size:22px;margin-bottom:4px}
.category-item .cat-name{font-size:11px;color:#64748b;font-weight:500}
.category-item.active .cat-name{color:#6366f1;font-weight:700}
.submit-btn{width:100%;padding:16px;border:none;border-radius:16px;font-size:17px;font-weight:700;color:#fff;cursor:pointer;transition:all .2s;margin-top:8px}
.submit-btn.expense{background:linear-gradient(135deg,#ef4444,#f97316)}
.submit-btn.income{background:linear-gradient(135deg,#22c55e,#10b981)}
.submit-btn:active{transform:scale(.98)}
.submit-btn.milktea{background:linear-gradient(135deg,#f59e0b,#f97316)}

/* 照片上传 */
.photo-upload{width:100%;height:140px;border:2px dashed #cbd5e1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#f8fafc;transition:all .2s;overflow:hidden;position:relative}
.photo-upload:active{border-color:#6366f1}
.photo-upload .upload-icon{font-size:32px;margin-bottom:6px}
.photo-upload .upload-text{font-size:13px;color:#94a3b8}
.photo-upload img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.photo-upload .change-btn{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;padding:4px 10px;border-radius:8px;font-size:11px;z-index:1}
</style>
</head>
<body>
<div class="app">
  <!-- 顶部 -->
  <div class="header">
    <h1>随手记</h1>
    <p id="headerDate">记录每一笔收支</p>
  </div>

  <!-- 统计卡片 -->
  <div class="stats">
    <div class="stat-card expense">
      <div class="label">本月支出</div>
      <div class="value" id="totalExpense">¥0.00</div>
    </div>
    <div class="stat-card income">
      <div class="label">本月收入</div>
      <div class="value" id="totalIncome">¥0.00</div>
    </div>
  </div>

  <!-- 总览页面 -->
  <div class="page active" id="page-overview">
    <div class="recent-section">
      <div class="page-title">最近记账 <span class="count" id="overviewCount">0 笔</span></div>
      <div id="overviewRecords"></div>
    </div>
    <div class="recent-section" style="margin-top:20px">
      <div class="page-title">最近奶茶 <span class="count" id="overviewMilkteaCount">0 杯</span></div>
      <div class="milktea-preview" id="overviewMilktea"></div>
    </div>
  </div>

  <!-- 记账页面 -->
  <div class="page" id="page-ledger">
    <div class="page-title">账单明细 <span class="count" id="recordCount">0 笔</span></div>
    <div class="record-list" id="recordList"></div>
  </div>

  <!-- 奶茶页面 -->
  <div class="page" id="page-milktea">
    <div class="page-title">奶茶记录 <span class="count" id="milkteaCount">0 杯</span></div>
    <div id="milkteaList"></div>
  </div>
</div>

<!-- 底部导航栏 -->
<div class="bottom-nav">
  <div class="nav-item active" data-page="overview">
    <div class="nav-icon">📊</div>
    <div class="nav-label">总览</div>
  </div>
  <div class="nav-item" data-page="ledger">
    <div class="nav-icon">📒</div>
    <div class="nav-label">记账</div>
  </div>
  <div class="nav-item nav-add" id="navAdd">
    <div class="add-circle">+</div>
    <div class="nav-label">添加</div>
  </div>
  <div class="nav-item" data-page="milktea">
    <div class="nav-icon">🧋</div>
    <div class="nav-label">奶茶</div>
  </div>
  <div class="nav-item" id="navStats">
    <div class="nav-icon">📈</div>
    <div class="nav-label">统计</div>
  </div>
</div>

<!-- 记账弹窗 -->
<div class="modal-overlay" id="ledgerModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="ledgerModalTitle">添加记录</h2>
      <div class="modal-header-actions">
        <button class="modal-delete" id="deleteRecordBtn" style="display:none">🗑️</button>
        <button class="modal-close" id="closeLedgerModal">✕</button>
      </div>
    </div>
    <div class="type-selector">
      <div class="type-btn expense active" data-type="expense">
        <div class="type-icon">📤</div>
        <div class="type-label">支出</div>
        <div class="type-check">✓ 已选</div>
      </div>
      <div class="type-btn income" data-type="income">
        <div class="type-icon">📥</div>
        <div class="type-label">收入</div>
        <div class="type-check">✓ 已选</div>
      </div>
    </div>
    <div class="form-group">
      <input type="number" class="amount-input expense" id="amountInput" placeholder="0.00" step="0.01" inputmode="decimal">
    </div>
    <div class="form-group">
      <label class="form-label">分类</label>
      <div class="category-grid" id="categoryGrid"></div>
    </div>
    <div class="form-group">
      <label class="form-label">日期</label>
      <input type="date" class="form-input" id="dateInput">
    </div>
    <div class="form-group">
      <label class="form-label">备注</label>
      <input type="text" class="form-input" id="noteInput" placeholder="添加备注（可选）">
    </div>
    <button class="submit-btn expense" id="submitLedgerBtn">保存记录</button>
  </div>
</div>

<!-- 奶茶弹窗 -->
<div class="modal-overlay" id="milkteaModal">
  <div class="modal">
    <div class="modal-header">
      <h2>记录一杯奶茶</h2>
      <button class="modal-close" id="closeMilkteaModal">✕</button>
    </div>
    <div class="form-group">
      <div class="photo-upload" id="photoUpload">
        <div class="upload-icon">📷</div>
        <div class="upload-text">点击添加照片</div>
        <input type="file" id="photoInput" accept="image/*" style="display:none">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">奶茶名称</label>
      <input type="text" class="form-input" id="milkteaNameInput" placeholder="例如：珍珠奶茶">
    </div>
    <div class="form-group">
      <label class="form-label">店铺</label>
      <input type="text" class="form-input" id="milkteaShopInput" placeholder="例如：喜茶、奈雪">
    </div>
    <div class="form-group">
      <label class="form-label">价格（元）</label>
      <input type="number" class="form-input" id="milkteaPriceInput" placeholder="0.00" step="0.01" inputmode="decimal">
    </div>
    <div class="form-group">
      <label class="form-label">评分</label>
      <div class="category-grid" id="ratingGrid">
        <div class="category-item" data-rating="1"><div class="cat-icon">⭐</div><div class="cat-name">1分</div></div>
        <div class="category-item" data-rating="2"><div class="cat-icon">⭐⭐</div><div class="cat-name">2分</div></div>
        <div class="category-item" data-rating="3"><div class="cat-icon">⭐⭐⭐</div><div class="cat-name">3分</div></div>
        <div class="category-item" data-rating="4"><div class="cat-icon">⭐⭐⭐⭐</div><div class="cat-name">4分</div></div>
        <div class="category-item" data-rating="5"><div class="cat-icon">⭐⭐⭐⭐⭐</div><div class="cat-name">5分</div></div>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">日期</label>
      <input type="date" class="form-input" id="milkteaDateInput">
    </div>
    <div class="form-group">
      <label class="form-label">备注</label>
      <input type="text" class="form-input" id="milkteaNoteInput" placeholder="甜度、冰度、口感等">
    </div>
    <button class="submit-btn milktea" id="submitMilkteaBtn">保存记录</button>
  </div>
</div>

<script>
// 数据存储
var STORAGE_KEY = 'suishouji_ledger';
var MILKTEA_KEY = 'suishouji_milktea';

function loadRecords() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch(e) { return []; }
}
function saveRecords(r) { localStorage.setItem(STORAGE_KEY, JSON.stringify(r)); }
function loadMilktea() {
  try { return JSON.parse(localStorage.getItem(MILKTEA_KEY)) || []; }
  catch(e) { return []; }
}
function saveMilktea(m) { localStorage.setItem(MILKTEA_KEY, JSON.stringify(m)); }

// 分类数据
var expenseCategories = [
  {icon:'🍜',name:'餐饮'},{icon:'🛒',name:'购物'},{icon:'🚗',name:'交通'},
  {icon:'🏠',name:'居住'},{icon:'🎮',name:'娱乐'},{icon:'💊',name:'医疗'},
  {icon:'📚',name:'学习'},{icon:'✈️',name:'旅行'},{icon:'🧋',name:'奶茶'},{icon:'📦',name:'其他'}
];
var incomeCategories = [
  {icon:'💰',name:'工资'},{icon:'🎁',name:'奖金'},{icon:'📈',name:'理财'},
  {icon:'💼',name:'兼职'},{icon:'🏠',name:'租金'},{icon:'📦',name:'其他'}
];

// 状态
var currentType = 'expense';
var currentCategory = null;
var currentRating = 0;
var editingRecordId = null;
var currentPhoto = null;
var currentPage = 'overview';

// 工具函数
function formatMoney(n) { return '¥' + Number(n).toFixed(2); }
function formatDate(d) {
  var dt = new Date(d);
  return (dt.getMonth()+1) + '月' + dt.getDate() + '日';
}
function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2,5); }

// 渲染统计
function renderStats() {
  var records = loadRecords();
  var now = new Date();
  var monthRecords = records.filter(function(r) {
    var d = new Date(r.date);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  });
  var expense = monthRecords.filter(function(r){return r.type==='expense'}).reduce(function(s,r){return s+Number(r.amount)},0);
  var income = monthRecords.filter(function(r){return r.type==='income'}).reduce(function(s,r){return s+Number(r.amount)},0);
  document.getElementById('totalExpense').textContent = formatMoney(expense);
  document.getElementById('totalIncome').textContent = formatMoney(income);
}

// 渲染总览页面
function renderOverview() {
  var records = loadRecords().sort(function(a,b){return new Date(b.date)-new Date(a.date)});
  var recent = records.slice(0, 5);
  document.getElementById('overviewCount').textContent = records.length + ' 笔';
  var container = document.getElementById('overviewRecords');
  if (recent.length === 0) {
    container.innerHTML = '<div class="empty" style="padding:24px"><div class="icon" style="font-size:36px">📝</div><p>还没有记录</p></div>';
  } else {
    var html = '';
    for (var i = 0; i < recent.length; i++) {
      var r = recent[i];
      var cats = r.type === 'expense' ? expenseCategories : incomeCategories;
      var cat = cats.find(function(c){return c.name===r.category}) || {icon:'📦',name:r.category||'其他'};
      html += '<div class="recent-item" data-id="' + r.id + '">' +
        '<div class="ri-icon ' + r.type + '">' + cat.icon + '</div>' +
        '<div class="ri-info"><div class="ri-name">' + (r.note || cat.name) + '</div>' +
        '<div class="ri-meta">' + cat.name + ' · ' + formatDate(r.date) + '</div></div>' +
        '<div class="ri-amount ' + r.type + '">' + (r.type==='expense'?'-':'+') + formatMoney(r.amount) + '</div></div>';
    }
    container.innerHTML = html;
    var items = container.querySelectorAll('.recent-item');
    for (var j = 0; j < items.length; j++) {
      items[j].addEventListener('click', function() { openEditModal(this.dataset.id); });
    }
  }

  // 奶茶预览
  var milktea = loadMilktea().sort(function(a,b){return new Date(b.date)-new Date(a.date)}).slice(0, 5);
  document.getElementById('overviewMilkteaCount').textContent = loadMilktea().length + ' 杯';
  var mpContainer = document.getElementById('overviewMilktea');
  if (milktea.length === 0) {
    mpContainer.innerHTML = '<div class="empty" style="padding:24px;width:100%"><div class="icon" style="font-size:36px">🧋</div><p>还没有奶茶记录</p></div>';
  } else {
    var mpHtml = '';
    for (var k = 0; k < milktea.length; k++) {
      var m = milktea[k];
      mpHtml += '<div class="mp-card">' +
        (m.photo ? '<img class="mp-img" src="' + m.photo + '" alt="' + m.name + '">' : '<div class="mp-img" style="display:flex;align-items:center;justify-content:center;font-size:36px">🧋</div>') +
        '<div class="mp-info"><div class="mp-name">' + (m.name||'未命名') + '</div>' +
        '<div class="mp-meta">' + (m.shop||'') + ' · ' + formatDate(m.date) + '</div></div></div>';
    }
    mpContainer.innerHTML = mpHtml;
  }
}

// 渲染记账列表
function renderRecords() {
  var records = loadRecords().sort(function(a,b){return new Date(b.date)-new Date(a.date)});
  var list = document.getElementById('recordList');
  document.getElementById('recordCount').textContent = records.length + ' 笔';
  if (records.length === 0) {
    list.innerHTML = '<div class="empty"><div class="icon">📝</div><p>还没有记录，点底部 + 添加</p></div>';
    return;
  }
  var html = '';
  for (var i = 0; i < records.length; i++) {
    var r = records[i];
    var cats = r.type === 'expense' ? expenseCategories : incomeCategories;
    var cat = cats.find(function(c){return c.name===r.category}) || {icon:'📦',name:r.category||'其他'};
    html += '<div class="record-item" data-id="' + r.id + '">' +
      '<div class="record-icon ' + r.type + '">' + cat.icon + '</div>' +
      '<div class="record-info"><div class="name">' + (r.note || cat.name) + '</div>' +
      '<div class="meta">' + cat.name + ' · ' + formatDate(r.date) + '</div></div>' +
      '<div class="record-amount ' + r.type + '">' + (r.type==='expense'?'-':'+') + formatMoney(r.amount) + '</div>' +
      '<div class="record-edit">✏️</div></div>';
  }
  list.innerHTML = html;
  var items = list.querySelectorAll('.record-item');
  for (var j = 0; j < items.length; j++) {
    items[j].addEventListener('click', function() { openEditModal(this.dataset.id); });
  }
}

// 渲染分类
function renderCategories() {
  var grid = document.getElementById('categoryGrid');
  var cats = currentType === 'expense' ? expenseCategories : incomeCategories;
  var html = '';
  for (var i = 0; i < cats.length; i++) {
    var c = cats[i];
    var active = currentCategory === c.name ? 'active' : '';
    html += '<div class="category-item ' + active + '" data-cat="' + c.name + '">' +
      '<div class="cat-icon">' + c.icon + '</div><div class="cat-name">' + c.name + '</div></div>';
  }
  grid.innerHTML = html;
  var items = grid.querySelectorAll('.category-item');
  for (var j = 0; j < items.length; j++) {
    items[j].addEventListener('click', function() {
      currentCategory = this.dataset.cat;
      renderCategories();
    });
  }
}

// 页面切换
function switchPage(page) {
  currentPage = page;
  var pages = document.querySelectorAll('.page');
  for (var i = 0; i < pages.length; i++) pages[i].classList.remove('active');
  document.getElementById('page-' + page).classList.add('active');
  var navItems = document.querySelectorAll('.nav-item[data-page]');
  for (var j = 0; j < navItems.length; j++) {
    if (navItems[j].dataset.page === page) navItems[j].classList.add('active');
    else navItems[j].classList.remove('active');
  }
  if (page === 'overview') renderOverview();
  if (page === 'ledger') renderRecords();
  if (page === 'milktea') renderMilktea();
}

// 打开记账弹窗
function openLedgerModal(isEdit) {
  document.getElementById('ledgerModal').classList.add('show');
  document.getElementById('ledgerModalTitle').textContent = isEdit ? '编辑记录' : '添加记录';
  document.getElementById('deleteRecordBtn').style.display = isEdit ? 'flex' : 'none';
  document.getElementById('submitLedgerBtn').textContent = isEdit ? '保存修改' : '保存记录';
  if (!isEdit) {
    editingRecordId = null;
    currentType = 'expense';
    currentCategory = null;
    document.getElementById('amountInput').value = '';
    document.getElementById('noteInput').value = '';
    document.getElementById('dateInput').value = todayStr();
  }
  updateTypeUI();
  renderCategories();
}

function closeLedgerModal() {
  document.getElementById('ledgerModal').classList.remove('show');
}

// 打开编辑弹窗
function openEditModal(id) {
  var records = loadRecords();
  var r = null;
  for (var i = 0; i < records.length; i++) {
    if (records[i].id === id) { r = records[i]; break; }
  }
  if (!r) return;
  editingRecordId = id;
  currentType = r.type;
  currentCategory = r.category;
  document.getElementById('amountInput').value = r.amount;
  document.getElementById('noteInput').value = r.note || '';
  document.getElementById('dateInput').value = r.date;
  openLedgerModal(true);
}

// 更新类型UI
function updateTypeUI() {
  var btns = document.querySelectorAll('.type-btn');
  for (var i = 0; i < btns.length; i++) {
    if (btns[i].dataset.type === currentType) btns[i].classList.add('active');
    else btns[i].classList.remove('active');
  }
  var ai = document.getElementById('amountInput');
  ai.classList.remove('expense','income');
  ai.classList.add(currentType);
  var sb = document.getElementById('submitLedgerBtn');
  sb.classList.remove('expense','income');
  sb.classList.add(currentType);
}

// 保存记账
function saveLedgerRecord() {
  var amount = parseFloat(document.getElementById('amountInput').value);
  var date = document.getElementById('dateInput').value;
  var note = document.getElementById('noteInput').value.trim();
  if (!amount || amount <= 0) { alert('请输入有效金额'); return; }
  if (!currentCategory) { alert('请选择分类'); return; }
  if (!date) { alert('请选择日期'); return; }
  var records = loadRecords();
  if (editingRecordId) {
    for (var i = 0; i < records.length; i++) {
      if (records[i].id === editingRecordId) {
        records[i].type = currentType;
        records[i].amount = amount;
        records[i].category = currentCategory;
        records[i].date = date;
        records[i].note = note;
        break;
      }
    }
  } else {
    records.push({
      id: genId(), type: currentType, amount: amount,
      category: currentCategory, date: date, note: note,
      createdAt: Date.now()
    });
  }
  saveRecords(records);
  renderStats();
  renderOverview();
  renderRecords();
  closeLedgerModal();
}

// 删除记录
function deleteRecord() {
  if (!editingRecordId) return;
  if (!confirm('确定要删除这条记录吗？')) return;
  var records = loadRecords();
  var newRecords = [];
  for (var i = 0; i < records.length; i++) {
    if (records[i].id !== editingRecordId) newRecords.push(records[i]);
  }
  saveRecords(newRecords);
  renderStats();
  renderOverview();
  renderRecords();
  closeLedgerModal();
}

// 奶茶相关
function renderMilktea() {
  var list = loadMilktea().sort(function(a,b){return new Date(b.date)-new Date(a.date)});
  var container = document.getElementById('milkteaList');
  document.getElementById('milkteaCount').textContent = list.length + ' 杯';
  if (list.length === 0) {
    container.innerHTML = '<div class="empty"><div class="icon">🧋</div><p>还没有奶茶记录，点底部 + 添加</p></div>';
    return;
  }
  var html = '';
  for (var i = 0; i < list.length; i++) {
    var m = list[i];
    html += '<div class="milktea-item" data-id="' + m.id + '">';
    if (m.photo) html += '<img class="milktea-img" src="' + m.photo + '" alt="' + m.name + '">';
    html += '<div class="milktea-info"><div class="name">' + (m.name||'未命名') + '</div>' +
      '<div class="meta"><span>' + (m.shop||'未知店铺') + ' · ' + formatDate(m.date) + '</span>' +
      '<span class="price">' + (m.price?formatMoney(m.price):'') + '</span></div>' +
      '<div class="rating" style="margin-top:4px">' + '⭐'.repeat(m.rating||0) + '☆'.repeat(5-(m.rating||0)) + '</div></div></div>';
  }
  container.innerHTML = html;
}

function openMilkteaModal() {
  document.getElementById('milkteaModal').classList.add('show');
  document.getElementById('milkteaNameInput').value = '';
  document.getElementById('milkteaShopInput').value = '';
  document.getElementById('milkteaPriceInput').value = '';
  document.getElementById('milkteaNoteInput').value = '';
  document.getElementById('milkteaDateInput').value = todayStr();
  currentRating = 0;
  currentPhoto = null;
  var ratingItems = document.querySelectorAll('#ratingGrid .category-item');
  for (var i = 0; i < ratingItems.length; i++) ratingItems[i].classList.remove('active');
  var upload = document.getElementById('photoUpload');
  upload.innerHTML = '<div class="upload-icon">📷</div><div class="upload-text">点击添加照片</div><input type="file" id="photoInput" accept="image/*" style="display:none">';
  bindPhotoUpload();
}

function closeMilkteaModal() {
  document.getElementById('milkteaModal').classList.remove('show');
}

function bindPhotoUpload() {
  var upload = document.getElementById('photoUpload');
  var input = document.getElementById('photoInput');
  upload.addEventListener('click', function() { input.click(); });
  input.addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      currentPhoto = ev.target.result;
      upload.innerHTML = '<img src="' + currentPhoto + '" alt="photo"><div class="change-btn">更换</div><input type="file" id="photoInput" accept="image/*" style="display:none">';
      bindPhotoUpload();
    };
    reader.readAsDataURL(file);
  });
}

function saveMilkteaRecord() {
  var name = document.getElementById('milkteaNameInput').value.trim();
  var shop = document.getElementById('milkteaShopInput').value.trim();
  var price = parseFloat(document.getElementById('milkteaPriceInput').value) || 0;
  var date = document.getElementById('milkteaDateInput').value;
  var note = document.getElementById('milkteaNoteInput').value.trim();
  if (!name) { alert('请输入奶茶名称'); return; }
  if (!date) { alert('请选择日期'); return; }
  var list = loadMilktea();
  list.push({
    id: genId(), name: name, shop: shop, price: price,
    rating: currentRating, date: date, note: note,
    photo: currentPhoto, createdAt: Date.now()
  });
  saveMilktea(list);
  renderOverview();
  renderMilktea();
  closeMilkteaModal();
}

// 初始化
document.addEventListener('DOMContentLoaded', function() {
  // 底部导航
  var navItems = document.querySelectorAll('.nav-item[data-page]');
  for (var i = 0; i < navItems.length; i++) {
    navItems[i].addEventListener('click', function() { switchPage(this.dataset.page); });
  }
  // 添加按钮
  document.getElementById('navAdd').addEventListener('click', function() {
    if (currentPage === 'milktea') openMilkteaModal();
    else openLedgerModal();
  });
  // 统计按钮（暂时跳转到总览）
  document.getElementById('navStats').addEventListener('click', function() {
    alert('统计功能开发中，敬请期待！');
  });
  // 类型选择
  var typeBtns = document.querySelectorAll('.type-btn');
  for (var j = 0; j < typeBtns.length; j++) {
    typeBtns[j].addEventListener('click', function() {
      currentType = this.dataset.type;
      currentCategory = null;
      updateTypeUI();
      renderCategories();
    });
  }
  // 记账弹窗
  document.getElementById('closeLedgerModal').addEventListener('click', closeLedgerModal);
  document.getElementById('submitLedgerBtn').addEventListener('click', saveLedgerRecord);
  document.getElementById('deleteRecordBtn').addEventListener('click', deleteRecord);
  document.getElementById('ledgerModal').addEventListener('click', function(e) {
    if (e.target.id === 'ledgerModal') closeLedgerModal();
  });
  // 奶茶弹窗
  document.getElementById('closeMilkteaModal').addEventListener('click', closeMilkteaModal);
  document.getElementById('submitMilkteaBtn').addEventListener('click', saveMilkteaRecord);
  document.getElementById('milkteaModal').addEventListener('click', function(e) {
    if (e.target.id === 'milkteaModal') closeMilkteaModal();
  });
  // 评分
  var ratingItems = document.querySelectorAll('#ratingGrid .category-item');
  for (var k = 0; k < ratingItems.length; k++) {
    ratingItems[k].addEventListener('click', function() {
      currentRating = parseInt(this.dataset.rating);
      var all = document.querySelectorAll('#ratingGrid .category-item');
      for (var m = 0; m < all.length; m++) all[m].classList.remove('active');
      this.classList.add('active');
    });
  }
  // 照片上传
  bindPhotoUpload();
  // 日期默认
  document.getElementById('dateInput').value = todayStr();
  document.getElementById('milkteaDateInput').value = todayStr();
  // 头部日期
  var now = new Date();
  document.getElementById('headerDate').textContent = now.getFullYear() + '年' + (now.getMonth()+1) + '月 · 记录每一笔收支';
  // 初始渲染
  renderStats();
  renderOverview();
  renderRecords();
  renderMilktea();
  renderCategories();
});

// PWA Service Worker 注册
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').catch(function(err) {
      console.log('SW registration failed:', err);
    });
  });
}
</script>
